---
- name: Administrar servidores Ubuntu en Docker
  hosts: docker
  gather_facts: true

  tasks:
    - name: Mostrar el nombre del host
      ansible.builtin.debug:
        msg: "Nombre del servidor: {{ inventory_hostname }}"

    - name: Mostrar el sistema operativo
      ansible.builtin.debug:
        msg: "Sistema operativo: {{ ansible_facts.distribution }} {{ ansible_facts.distribution_version }}"

    - name: Crear el directorio de trabajo
      ansible.builtin.file:
        path: /tmp/ansible-demo
        state: directory
        mode: "0755"

    - name: Crear el archivo de información
      ansible.builtin.copy:
        dest: /tmp/ansible-demo/info.txt
        content: |
          Servidor: {{ inventory_hostname }}
          Sistema operativo: {{ ansible_facts.distribution }} {{ ansible_facts.distribution_version }}
        mode: "0644"

    - name: Crear los directorios de soporte
      ansible.builtin.file:
        path: "/tmp/ansible-demo/{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - logs
        - backup
        - config

    - name: Mostrar mensaje para servidores Ubuntu
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }} ejecuta Ubuntu."
      when: ansible_facts.distribution == "Ubuntu"
